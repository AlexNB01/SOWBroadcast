<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Waiting Screen</title>
<meta name="viewport" content="width=1920, height=1080, initial-scale=1" />
<!--
  One page for the three waiting scenes:  waiting.html?mode=start (default) | brb | end
    start  Starting Soon: text, countdown, videos, ticker, socials
    brb    Be Right Back: the same
    end    Thank You for Watching: no countdown, the logo sits under the text
  Optional: ?stinger=<ms> delays the slide-in (default 1800).
-->
<style>
@font-face{font-family:'Rajdhani';src:url("fonts/Rajdhani/Rajdhani-Bold.ttf") format('truetype');font-weight:700 900}
@font-face{font-family:'Rajdhani';src:url("fonts/Rajdhani/Rajdhani-Regular.ttf") format('truetype');font-weight:400}
:root{
  --primary:#0f1114;      
  --secondary:#ffffff;
  --tertiary:#3a3a90; 
  --quaternary:#2f3a43;
  --radius:16px;
  --shadow:0 10px 28px rgba(0,0,0,.35);
  --social-font-min:14px;
  --social-font-max:38px;
  --social-font:var(--social-font-max);
  --social-extra-pad:0px; 
}

*{box-sizing:border-box}
html,body{
  margin:0; padding:0;
  width:1920px; height:1080px;
  font-family:'Rajdhani',system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,'Helvetica Neue',Arial,sans-serif;
  overflow:hidden;
}
.root{ position:relative; width:1920px; height:1080px; }

.left-column{
  position:absolute;
  left:20px; top:20px; bottom:20px;
  width:430px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
}

.bigtext{
  width:100%;
  min-height:120px;
  background: color-mix(in srgb, var(--secondary) 50%, transparent);
  color:var(--primary);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px 20px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  position:relative;
}
.bigtext span {
  font-size: 68px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .8px;
  white-space: normal;
  word-break: keep-all;
  overflow-wrap: normal;
  hyphens: none;
  display: block;
  width: 100%;
  max-width: 100%;
  line-height: 1.1;
}
.bigtext::before, .bigtext::after{
  content:""; position:absolute; top:0; bottom:0; width:8px;
  background:var(--tertiary);
}
.bigtext::before{ left:0; border-radius:var(--radius) 0 0 var(--radius); }
.bigtext::after { right:0; border-radius:0 var(--radius) var(--radius) 0; }

.overlay-logo{
  max-width:100%;
  max-height:360px;
  height:auto; width:auto;
  object-fit:contain;
  filter:
    drop-shadow(0 8px 18px rgba(0,0,0,.45))
    drop-shadow(0 2px 4px rgba(0,0,0,.25));
  -webkit-user-drag:none; user-select:none;
}

.timer{
  width:100%; height:229px;
  background: color-mix(in srgb, var(--secondary) 50%, transparent);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; text-align:center;
}
.timer-value{ font-size:150px; font-weight:900; line-height:1; letter-spacing:2px; }

.video-wrap{
  position:absolute; right:20px; top:20px; width:1420px; height:799px;
  background:#000; border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
video{ width:100%; height:100%; background:#000; object-fit:cover; }
.novideo{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:28px; font-weight:700; letter-spacing:.5px; opacity:.8;
}

.ticker{
  position:absolute; right:20px; top:20px; width:1420px; height:100px;
  transform:translateY(calc(799px + 12px));
  background: color-mix(in srgb, var(--secondary) 50%, transparent); border-radius:12px; overflow:hidden;
  display:flex; align-items:center;
}
.ticker-inner{
  white-space:pre;
  will-change:transform;
  padding-left:100%;
  display:inline-block;
  font-weight:900; font-size:50px; color:#fff;
  letter-spacing:.8px; line-height:100px;
  text-shadow:0 2px 4px rgba(0,0,0,.45);
  animation:slideLeft 70s linear infinite;
}
@keyframes slideLeft{ 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }

.socials{
  position:absolute;
  right:20px;                 
  width:1420px;               
  bottom:20px; height:120px;
  display:flex; align-items:center;
  gap:12px; padding:0;
}

.social-chip{
  display:inline-flex; align-items:center; gap:0.2em;
  padding:0.55em calc(0.9em + var(--social-extra-pad));
  border-radius:999px;
  background: color-mix(in srgb, var(--secondary) 50%, transparent);
  color:#fff; font-weight:900; letter-spacing:.04em;
  font-size: var(--social-font);
  white-space:nowrap;
  flex:0 0 auto; min-width:0;
  line-height:1.2;
}
.social-icon{ width:1em; height:1em; flex:0 0 auto; filter: invert(1) brightness(1000%); }
.social-chip span{ white-space:nowrap; }

/* === Match schedule: lies over the video, comes and goes (Starting Soon: upcoming; Be Right Back: upcoming + results) === */
.schedule{
  --k:1;                       /* shrinks everything a little when many rows have to fit (set by schFit) */
  position:absolute; inset:0; padding:26px 40px 30px;
  display:flex; flex-direction:column; gap:12px;
  background: color-mix(in srgb, var(--secondary) 74%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border:2px solid color-mix(in srgb, var(--tertiary) 45%, transparent); border-radius:var(--radius);
  color:var(--primary);
  opacity:0; transform:translateY(16px); pointer-events:none;
  transition: opacity 600ms ease, transform 600ms cubic-bezier(.2,.8,.2,1);
}
.schedule.show{ opacity:1; transform:none; }
.sch-title{
  flex:0 0 auto; display:flex; align-items:center; gap:26px;
  font-size:48px; font-weight:900; letter-spacing:3px; text-transform:uppercase; line-height:1.1;
}
.sch-title::after{ content:""; flex:1 1 auto; height:6px; border-radius:3px; background:var(--tertiary); }
.sch-rows{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }

/* a day header ("Today", "Saturday") above the matches of that day */
.sch-day{
  flex:0 0 auto; display:flex; align-items:center; gap:18px;
  margin:calc(12px * var(--k)) 0 calc(4px * var(--k));
  font-size:calc(28px * var(--k)); font-weight:900; letter-spacing:3px; text-transform:uppercase; line-height:1;
  color:var(--tertiary);
}
.sch-day::after{ content:""; flex:1 1 auto; height:2px; background: color-mix(in srgb, var(--primary) 22%, transparent); }

.sch-row{
  flex:0 0 auto; height:calc(104px * var(--k));
  display:grid; grid-template-columns:calc(250px * var(--k)) minmax(0,1fr); align-items:center; column-gap:28px;
  padding:0 18px; border-bottom:2px solid color-mix(in srgb, var(--primary) 16%, transparent);
  animation:schIn 520ms cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i, 0) * 70ms);
}
@keyframes schIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
/* the next match: a little bigger and lit */
.sch-row.next{
  height:calc(120px * var(--k)); border-radius:12px; border-bottom-color:transparent;
  background: color-mix(in srgb, var(--tertiary) 20%, transparent);
  box-shadow: inset 8px 0 0 var(--tertiary);
}

.sch-when{ min-width:0; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:4px; }
.sch-time{ font-size:calc(46px * var(--k)); font-weight:900; color:var(--tertiary); letter-spacing:.6px; line-height:1; white-space:nowrap; }
.sch-time.tba{ opacity:.45; }
.sch-label{
  max-width:100%; font-size:calc(22px * var(--k)); font-weight:700; opacity:.7; letter-spacing:.8px; line-height:1.1;
  text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sch-live{
  display:inline-flex; align-items:center; gap:12px; padding:4px 18px 2px; border-radius:8px;
  background:#d7263d; color:#fff; font-size:calc(38px * var(--k)); font-weight:900; letter-spacing:2px; line-height:1.2;
}
.sch-live::before{ content:""; width:.36em; height:.36em; border-radius:50%; background:#fff; animation:schPulse 1.4s ease-in-out infinite; }
@keyframes schPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

/* the two teams are mirrored around a centre that stays in the same place on every row */
.sch-main{ min-width:0; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; column-gap:22px; }
.sch-team{ min-width:0; display:flex; align-items:center; gap:calc(18px * var(--k)); }
.sch-team.t1{ justify-content:flex-end; text-align:right; }
.sch-team.t2{ justify-content:flex-start; text-align:left; }
.sch-team.lost{ opacity:.55; }
/* every name has the same size (set by schFit) and may wrap to two lines instead of being cut */
.sch-name{
  flex:0 1 auto; min-width:0; font-size:var(--nf, calc(44px * var(--k))); font-weight:900; text-transform:uppercase;
  line-height:1.05; text-wrap:balance;
}
/* the logo always has its place, so the names stay in line whether a team has a logo or not */
.sch-logo{
  flex:0 0 auto; width:calc(80px * var(--k)); height:calc(80px * var(--k)); border-radius:calc(14px * var(--k)); overflow:hidden;
}
.sch-logo img{ display:block; width:100%; height:100%; object-fit:contain; }
.sch-mid{ min-width:calc(78px * var(--k)); text-align:center; font-size:calc(30px * var(--k)); font-weight:700; opacity:.7; letter-spacing:2px; }
.sch-score{ min-width:calc(150px * var(--k)); text-align:center; font-size:calc(60px * var(--k)); font-weight:900; letter-spacing:2px; color:var(--tertiary); white-space:nowrap; }

/* === Scene transition animations === */
.left-column, .video-wrap, .ticker, #socials {
  will-change: transform, opacity;
  transition: transform 750ms cubic-bezier(.2,.8,.2,1), opacity 700ms ease;
}
body:not(.visible) .left-column,
body.leaving       .left-column { transform: translateX(-50px); opacity: 0; }
body:not(.visible) .video-wrap,
body.leaving       .video-wrap  { transform: translateX(50px);  opacity: 0; }
body:not(.visible) .ticker,
body.leaving       .ticker      { transform: translateY(calc(799px + 12px)) translateX(50px); opacity: 0; }
/* End screen: no countdown; the column starts at the top and the logo hangs below the text box. */
body.mode-end .left-column{ justify-content:flex-start; gap:20px; }
body.mode-end .timer{ display:none; }
body.mode-end .overlay-logo{ margin-top:160px; }

body:not(.visible) #socials,
body.leaving       #socials     { transform: translateY(30px);  opacity: 0; }
</style>
</head>
<body>
<div class="root">
  <div class="left-column">
    <div class="bigtext">
      <span id="waitText"></span>
    </div>
    <img id="overlayLogo" class="overlay-logo" alt="overlay logo" style="display:none;">
    <div class="timer">
      <div id="timer" class="timer-value">00:00</div>
    </div>
  </div>
  <div class="video-wrap">
    <video id="player" autoplay muted playsinline></video>
    <div id="noVideo" class="novideo" style="display:none;">NO VIDEOS CONFIGURED</div>
    <div id="schedule" class="schedule">
      <div id="schTitle" class="sch-title"></div>
      <div id="schRows" class="sch-rows"></div>
    </div>
  </div>
  <div class="ticker">
    <div id="tickerInner" class="ticker-inner"></div>
  </div>
  <div id="socials" class="socials" style="display:none;"></div>

</div>


<script src="sow-data.js"></script>
<script>
// Which scene this is: ?mode=start | brb | end
const MODE = (function(){
  const m = (new URLSearchParams(location.search).get("mode") || "start").toLowerCase();
  return m === "brb" || m === "end" ? m : "start";
})();
const TEXT_FILE    = { start: "text_starting.txt", brb: "text_brb.txt", end: "text_end.txt" }[MODE];
const TEXT_DEFAULT = { start: "STARTING SOON!", brb: "BE RIGHT BACK!", end: "THANK YOU FOR WATCHING" }[MODE];
document.body.classList.add("mode-" + MODE);

const IS_UNDER_HTML = location.pathname.toLowerCase().includes("/html/");
let ROOT = IS_UNDER_HTML ? ".." : ".";
let SB, GENERAL, MATCH, WAIT;

function setRoots(){
  SB = ROOT + "/Scoreboard";
  GENERAL = SB + "/General";
  MATCH = SB + "/Match";
  WAIT = SB + "/Waiting";
}
setRoots();

  function ok(p){ return SOW.ok(p); }
  function read(p){ return SOW.read(p); }
(async ()=>{
  if (!(await ok(GENERAL + "/colors.txt"))) {
    for (const cand of ["..","../..","." ]) {
      const test = cand + "/Scoreboard/General/colors.txt";
      if (await ok(test)) { ROOT = cand; setRoots(); break; }
    }
  }
})();
const hex=s=>/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test((s||"").trim())?(s||"").trim():null;


  async function applyColors(){
    const kv={};
    (await read(GENERAL+"/colors.txt")).split(/\r?\n/).forEach(l=>{
      const m=l.match(/^\s*([^=#]+)\s*=\s*(.+?)\s*$/); if(m) kv[m[1].trim().toLowerCase()]=m[2].trim();
    });
    const p=hex(kv.primary)||"#0f1114", s=hex(kv.secondary)||"#ffffff",
          t=hex(kv.tertiary)||"#3a3a90", q=hex(kv.quaternary)||"#2f3a43";
    document.documentElement.style.setProperty("--primary",p);
    document.documentElement.style.setProperty("--secondary",s);
    document.documentElement.style.setProperty("--tertiary",t);
    document.documentElement.style.setProperty("--quaternary",q);
  }

async function resolveOverlayLogo(){
  const p = GENERAL + "/OverlayLogo.png";
  try{
    const r = await fetch(p + "?_=" + Date.now(), { method:"HEAD" });
    if (r.ok) return p;
  }catch{}
  return null;
}

async function upOverlayLogo(){
  const path = await resolveOverlayLogo();
  const img  = document.getElementById("overlayLogo");
  if (path){
    img.src = path + "?_=" + Date.now();
    img.style.display = "block";
  }else{
    img.removeAttribute("src");
    img.style.display = "none";
  }
}

function positionOverlayLogo(){
  const img  = document.getElementById("overlayLogo");
  const bt   = document.querySelector(".bigtext");
  const tm   = document.querySelector(".timer");
  const col  = document.querySelector(".left-column");
  if (!img || img.style.display === "none" || !bt || !tm || !col) return;

  const btr = bt.getBoundingClientRect();

  if (MODE === "end") {
    // No countdown: the logo fills what is left of the column under the text box (the layout places it).
    const gapHeight = Math.max(0, col.getBoundingClientRect().bottom - btr.bottom);
    img.style.height = `${Math.min(360, gapHeight * 0.7)}px`;
    return;
  }

  // Between the text box and the countdown, centred.
  const gapTop    = btr.bottom;
  const gapBottom = tm.getBoundingClientRect().top;
  const gapHeight = Math.max(0, gapBottom - gapTop);

  const targetH = Math.min(360, gapHeight * 0.7);
  img.style.height = `${targetH}px`;

  const centerY = gapTop + (gapHeight / 2);
  const topY    = centerY - (targetH / 2);
  img.style.top = `${Math.round(topY)}px`;
}

const _oldUpOverlayLogo = upOverlayLogo;
upOverlayLogo = async function(){
  await _oldUpOverlayLogo();
  positionOverlayLogo();
};

const _oldUpText = upText;
upText = async function(){
  await _oldUpText();
  fitBigText();
  positionOverlayLogo();
};

const _oldUpTimer = upTimer;
upTimer = async function(){
  await _oldUpTimer();
  positionOverlayLogo();
};

window.addEventListener("resize", function(){ fitBigText(); positionOverlayLogo(); });
document.fonts && document.fonts.ready && document.fonts.ready.then(function(){ fitBigText(); positionOverlayLogo(); });

  async function upText(){
    const txt=(await read(WAIT+"/"+TEXT_FILE)).trim() || TEXT_DEFAULT;
    document.getElementById("waitText").textContent = txt.toUpperCase();
  }

async function upTicker(){
  try {
    const useRaw = (await read(WAIT + "/ticker_use_override.txt")).trim();
    if (useRaw === "1") {
      const over = (await read(WAIT + "/ticker_override.txt"));
      const txt = over.trim();
      if (txt) {
        document.getElementById("tickerInner").textContent = txt;
        return;
      }
    }
  } catch (e) {
  }
  const raw = (await read(MATCH + "/matchtext.txt")).trim();
  document.getElementById("tickerInner").textContent = raw;
}

function labelFor(kind, handle){
  if(!handle) return "";
  if(kind === "discord") return "/" + handle;
  if(kind === "twitch") return "/" + handle;
  if(kind === "web")     return handle;
  return "@" + handle;
}

async function iconNode(kind){
  const path = GENERAL + "/Icons/" + kind + ".svg";
  try{
    const head = await fetch(path + "?_=" + Date.now(), {method:"HEAD"});
    if (head && head.ok) {
      const img = document.createElement("img");
      img.src = path + "?_=" + Date.now();
      img.alt = kind;
      img.className = "social-icon";
      return img;
    }
  }catch{}
  const wrap = document.createElement("span");
  wrap.className = "social-icon";
  wrap.innerHTML = ({
    twitch:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h17v11l-4 4h-4l-2 2H9v-2H6V3zm14 9V5H6v10h4v2l2-2h4l2-2z"/></svg>',
    twitter:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 5.8a7.6 7.6 0 0 1-2.2.6 3.8 3.8 0 0 0 1.7-2.1 7.6 7.6 0 0 1-2.4.9A3.8 3.8 0 0 0 12 8.5a10.8 10.8 0 0 1-7.8-4 3.8 3.8 0 0 0 1.2 5.1 3.7 3.7 0 0 1-1.7-.5v.1a3.8 3.8 0 0 0 3 3.7 3.8 3.8 0 0 1-1.7.1 3.8 3.8 0 0 0 3.5 2.6A7.6 7.6 0 0 1 2 17.5a10.7 10.7 0 0 0 5.8 1.7c7 0 10.8-5.8 10.8-10.8v-.5A7.7 7.7 0 0 0 22 5.8z"/></svg>',
    youtube:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.5a4 4 0 0 0-2.8-2.8C18 4 12 4 12 4s-6 0-8.2.7A4 4 0 0 0 1 7.5 41 41 0 0 0 1 12a41 41 0 0 0 .8 4.5 4 4 0 0 0 2.8 2.8C6 20 12 20 12 20s6 0 8.2-.7a4 4 0 0 0 2.8-2.8A41 41 0 0 0 23 12a41 41 0 0 0-.8-4.5zM10 15.5v-7l6 3.5-6 3.5z"/></svg>',
    instagram:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm6.5-.8a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg>',
    discord:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 5a16 16 0 0 0-3.6-1.1l-.3.6A13 13 0 0 1 12 4c-1 0-2 .1-3 .5l-.3-.6A16 16 0 0 0 5 5C3 8 2.6 11 2.7 14a15 15 0 0 0 4.7 2.3l.6-.9c-1-.3-1.9-.8-2.7-1.4.8.6 1.9 1.2 3.1 1.6a9 9 0 0 0 6.2 0c1.2-.4 2.3-1 3.1-1.6-.8.6-1.7 1-2.7 1.4l.6.9A15 15 0 0 0 21.3 14C21.4 11 21 8 19 5ZM9.6 13.4c-.7 0-1.3-.7-1.3-1.6s.6-1.6 1.3-1.6 1.3.7 1.3 1.6-.6 1.6-1.3 1.6Zm4.8 0c-.7 0-1.3-.7-1.3-1.6s.6-1.6 1.3-1.6 1.3.7 1.3 1.6-.6 1.6-1.3 1.6Z"/></svg>',
    web:      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2Zm0 2c1.7 0 3.2 3 3.6 7H8.4C8.8 7 10.3 4 12 4Zm-7 8c0-1 .1-2 .4-3h3c-.2 1-.4 2-.4 3s.2 2 .4 3h-3c-.3-1-.4-2-.4-3Zm7 8c-1.7 0-3.2-3-3.6-7h7.2C15.2 17 13.7 20 12 20Zm3.6-8c-.2-1-.4-2-.4-3h3c.3 1 .4 2 .4 3s-.1 2-.4 3h-3Z"/></svg>'
  })[kind] || '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>';
  return wrap.firstChild;
}

function onlyHandle(kind, val){
  let s = (val||"").trim();
  s = s.replace(/^https?:\/\//i, "");
  const doms = {
    twitch:/^([^\/]*twitch\.tv\/)/i,
    twitter:/^([^\/]*twitter\.com\/|[^\/]*x\.com\/)/i,
    youtube:/^([^\/]*youtube\.com\/|[^\/]*youtu\.be\/)/i,
    instagram:/^([^\/]*instagram\.com\/)/i,
    discord:/^([^\/]*discord\.gg\/|[^\/]*discord\.com\/invite\/)/i,
    web:/^/
  };
  if(doms[kind]) s = s.replace(doms[kind], "");
  s = s.replace(/^[@\/]+/, "");
  s = s.split(/[\/\?\#]/)[0];           
  return s;
}

async function upSocials(){
  const el = document.getElementById("socials");
  try{
    const raw = await read(WAIT + "/socials.json");
    const data = JSON.parse(raw || "null");
    const key = JSON.stringify(Object.keys(data || {}).sort().reduce((acc, k) => {
      acc[k] = data[k];
      return acc;
    }, {}));
    if (key === upSocials._lastKey) return;
    upSocials._lastKey = key;
    if(!data || Object.keys(data).length===0){ el.style.display="none"; el.innerHTML=""; return; }

    el.innerHTML = "";
    const order = ["twitch","twitter","youtube","instagram","discord","web"];
    for (const key of order){
      const value = data[key];
      if(!value) continue;
      const handle = onlyHandle(key, value);
      if(!handle) continue;

      const chip = document.createElement("div");
      chip.className = "social-chip";

      const icon = await iconNode(key);
      chip.appendChild(icon);

      const span = document.createElement("span");
      span.textContent = labelFor(key, handle);
      chip.appendChild(span);

      el.appendChild(chip);
    }

    el.style.display = el.childElementCount ? "flex" : "none";
    autoScaleSocials();
  }catch(e){
    el.style.display="none"; el.innerHTML=""
  }
}

function autoScaleSocials(){
  const root = document.documentElement;
  const wrap = document.getElementById("socials");
  const chips = Array.from(wrap.querySelectorAll(".social-chip"));
  if (!chips.length) return;

  root.style.setProperty("--social-extra-pad", "0px");

  const cs = getComputedStyle(root);
  const min = parseInt(cs.getPropertyValue("--social-font-min")) || 16;
  const max = parseInt(cs.getPropertyValue("--social-font-max")) || 40;
  const gapPx = parseFloat(getComputedStyle(wrap).gap) || 0;
  const wrapWidth = wrap.clientWidth;

  const totalWidth = () =>
    chips.reduce((acc, ch) => acc + ch.scrollWidth, 0) +
    gapPx * Math.max(0, chips.length - 1);

  let lo = min, hi = max, best = min;
  while (lo <= hi){
    const mid = Math.floor((lo + hi) / 2);
    root.style.setProperty("--social-font", mid + "px");
    if (totalWidth() <= wrapWidth + 0.5){ best = mid; lo = mid + 1; }
    else { hi = mid - 1; }
  }
  root.style.setProperty("--social-font", best + "px");

  const remaining = Math.max(0, wrapWidth - totalWidth());
  const perSide = remaining / (chips.length * 2);
  root.style.setProperty("--social-extra-pad", perSide.toFixed(2) + "px");
}


window.addEventListener("resize", autoScaleSocials);
document.fonts && document.fonts.ready && document.fonts.ready.then(autoScaleSocials);

function fitBigText(){
  const box = document.querySelector(".bigtext");
  const span = document.getElementById("waitText");
  if(!box || !span) return;

  const MAX_SIZE = 68;
  const MIN_SIZE = 14;
  const SAFETY  = 16;

  span.style.whiteSpace   = "normal";
  span.style.wordBreak    = "keep-all";
  span.style.overflowWrap = "normal";
  span.style.hyphens      = "none";
  span.style.display      = "block";
  span.style.width        = "100%";

  const cs = getComputedStyle(box);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const available = Math.max(0, box.clientWidth - padX - SAFETY);

  const words = (span.textContent || "").trim().split(/\s+/).filter(Boolean);
  const longest = words.reduce((a,w)=> w.length>a.length ? w : a, "");

  if (!longest) { span.style.fontSize = MAX_SIZE + "px"; return; }

  const meas = document.createElement("span");
  const sCS = getComputedStyle(span);
  meas.style.position = "absolute";
  meas.style.visibility = "hidden";
  meas.style.whiteSpace = "nowrap";
  meas.style.fontFamily = sCS.fontFamily;
  meas.style.fontWeight = sCS.fontWeight;
  meas.style.letterSpacing = sCS.letterSpacing;
  meas.style.textTransform = sCS.textTransform;
  meas.textContent = longest;
  document.body.appendChild(meas);

  let lo = MIN_SIZE, hi = MAX_SIZE, best = MIN_SIZE;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    meas.style.fontSize = mid + "px";
    if (meas.scrollWidth <= available + 0.5) {
      best = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }

  span.style.fontSize = best + "px";
  meas.remove();
}

let timerSeconds = 0;
let lastTimerText = null;

function formatMMSS(s){
  s = Math.max(0, s|0);
  const m = Math.floor(s/60).toString().padStart(2,"0");
  const sec = (s%60).toString().padStart(2,"0");
  return `${m}:${sec}`;
}

async function upTimer(){
  const sRaw = (await read(WAIT+"/timer_seconds.txt")).trim();
  const s = parseInt(sRaw, 10);
  const secs = isNaN(s) ? 0 : Math.max(0, s);
  const nextText = formatMMSS(secs);
  if (nextText !== lastTimerText) {
    document.getElementById("timer").textContent = nextText;
    lastTimerText = nextText;
  }
}

  let playlist = []; let playIndex = 0;
  let lastPlaylistKey = null;
	function resolveUrl(_base, file){
	  return WAIT + "/Playlist/" + file;
	}
  async function loadPlaylist(){
    const base = (await read(WAIT+"/videos_dir.txt")).trim();
    const lines = (await read(WAIT+"/videos.txt")).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const nextKey = lines.join("\n");
    if (nextKey === lastPlaylistKey) return;
    lastPlaylistKey = nextKey;
    playlist = lines.map(fn => resolveUrl(base, fn));
    for (let i = playlist.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
    }
    playIndex = 0;
    const has = playlist.length>0;
    document.getElementById("noVideo").style.display = has ? "none" : "flex";
    if(has) await playCurrent();
    else { const v=document.getElementById("player"); v.removeAttribute("src"); v.load(); }
  }
  async function playCurrent(){
    const v = document.getElementById("player");
    if(playlist.length===0) return;
    if(playIndex<0 || playIndex>=playlist.length) playIndex = 0;
    const src = playlist[playIndex];
    v.src = src;
    try{ await v.play(); }catch(e){}
  }
  function nextVideo(){
    if(playlist.length===0) return;
    playIndex = (playIndex + 1) % playlist.length;
    playCurrent();
  }
  (function attachVideoHandlers(){
    const v=document.getElementById("player");
    v.addEventListener("ended", nextVideo);
    v.addEventListener("error", nextVideo);
  })();


// ---- Match schedule ------------------------------------------------------------------------------------
// state.schedule = { enabled, rows, seconds, upcoming:[...], results:[...] } (built by the program from the SOWDraft link).
// The panel cycles: upcoming -> (Be Right Back only) latest results -> video alone -> ..., each for `seconds`.
// Starting Soon lists only the upcoming matches; the end screen never shows it.
const SCH = { data:null, key:"", pages:[], current:null, timer:0 };

function schTime(ms){ return new Date(ms).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit", hour12:false }); }

function schDayKey(ms){ const d = new Date(ms); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

// "Today", "Tomorrow", "Saturday", and for a day further away "Saturday 31 Oct".
function schDayTitle(ms){
  const d = new Date(ms), now = new Date();
  const days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  if (days <= 0) return days === 0 ? "Today" : d.toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"short" });
  if (days === 1) return "Tomorrow";
  const weekday = d.toLocaleDateString("en-GB", { weekday:"long" });
  return days < 7 ? weekday : weekday + " " + d.toLocaleDateString("en-GB", { day:"numeric", month:"short" });
}

function schEl(tag, cls, text){
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

// A team logo: only files inside the Scoreboard folder can be shown. A team without a logo (or one that does not load),
// and a team that is not known yet (TBD), gets the Overwatch logo instead.
const SCH_FALLBACK_LOGO = "assets/ow_logo.png";
function schLogo(path, name){
  const slot = schEl("div", "sch-logo");
  const img = schEl("img");
  img.alt = "";
  const fallback = () => { img.onerror = null; img.src = SCH_FALLBACK_LOGO; };
  const own = path && name !== "TBD" && !/^([a-zA-Z][a-zA-Z0-9+.-]*:|\/|\\)/.test(path);
  if (own) { img.onerror = fallback; img.src = SB + "/" + path.replace(/\\/g, "/"); }
  else fallback();
  slot.appendChild(img);
  return slot;
}

function schTeam(side, name, logo, lost){
  const el = schEl("div", "sch-team " + side + (lost ? " lost" : ""));
  const label = schEl("div", "sch-name", name);
  const slot = schLogo(logo, name);
  if (side === "t1") { el.appendChild(label); el.appendChild(slot); }
  else               { el.appendChild(slot); el.appendChild(label); }
  return el;
}

// The left column of a row: what time it is (or LIVE / ASAP) and which round, or only the round for a result.
function schWhen(page, m){
  const when = schEl("div", "sch-when");
  if (page === "upcoming") {
    if (m.live) when.appendChild(schEl("span", "sch-live", "LIVE"));
    else if (m.scheduled_at) when.appendChild(schEl("div", "sch-time", schTime(m.scheduled_at)));
    else if (m.asap) when.appendChild(schEl("div", "sch-time", "ASAP"));
    else when.appendChild(schEl("div", "sch-time tba", "TBA"));
  }
  if (m.label) when.appendChild(schEl("div", "sch-label", m.label));
  return when;
}

function schRow(page, m, index, next){
  const row = schEl("div", "sch-row" + (next ? " next" : ""));
  row.style.setProperty("--i", index);
  const lost1 = page === "results" && m.score1 != null && m.score2 != null && m.score1 < m.score2;
  const lost2 = page === "results" && m.score1 != null && m.score2 != null && m.score2 < m.score1;
  const main = schEl("div", "sch-main");
  main.appendChild(schTeam("t1", m.team1, m.team1_logo, lost1));
  main.appendChild(page === "results"
    ? schEl("div", "sch-score", (m.score1 == null ? "-" : m.score1) + " – " + (m.score2 == null ? "-" : m.score2))
    : schEl("div", "sch-mid", "VS"));
  main.appendChild(schTeam("t2", m.team2, m.team2_logo, lost2));
  row.appendChild(schWhen(page, m));
  row.appendChild(main);
  return row;
}

// The upcoming matches with a header above each day (matches without any time follow "Later" once days have been shown).
function schUpcomingNodes(list){
  const nodes = [];
  let group = null, headers = 0, index = 0, nextDone = false;
  for (const m of list) {
    const at = m.scheduled_at || m.target_at || 0;
    const key = m.live ? "live" : at ? schDayKey(at) : "later";
    if (key !== group) {
      group = key;
      if (key !== "live" && (key !== "later" || headers > 0)) {
        nodes.push(schEl("div", "sch-day", key === "later" ? "Later" : schDayTitle(at)));
        headers++;
      }
    }
    const next = !m.live && !nextDone;
    if (!m.live) nextDone = true;
    nodes.push(schRow("upcoming", m, index++, next));
  }
  return nodes;
}

// The rows fill the panel: start big (few rows) and shrink everything a step at a time until all of it fits under the title.
// Then one name size for every team: the largest at which each name fits in two lines.
function schFit(panel, rows){
  let k = 1.4;
  panel.style.setProperty("--k", k);
  while (rows.scrollHeight > rows.clientHeight + 1 && k > 0.5) {
    k = Math.round((k - 0.05) * 100) / 100;
    panel.style.setProperty("--k", k);
  }
  const names = [...rows.querySelectorAll(".sch-name")];
  let size = 44 * k;
  const fits = () => names.every(el => {
    const lh = parseFloat(getComputedStyle(el).lineHeight) || size * 1.05;
    return el.scrollWidth <= el.clientWidth + 1 && el.getBoundingClientRect().height <= lh * 2 + 2;
  });
  panel.style.setProperty("--nf", size + "px");
  while (!fits() && size > 22) {
    size -= 2;
    panel.style.setProperty("--nf", size + "px");
  }
}

function schRender(page){
  const panel = document.getElementById("schedule");
  const d = SCH.data;
  const list = page === "results" ? d.results : d.upcoming;
  panel.classList.toggle("results", page === "results");
  document.getElementById("schTitle").textContent = page === "results" ? "Latest results" : "Upcoming matches";
  const rows = document.getElementById("schRows");
  rows.replaceChildren(...(page === "results" ? list.map((m, i) => schRow("results", m, i, false)) : schUpcomingNodes(list)));
  schFit(panel, rows);
}

function schShow(page){
  const panel = document.getElementById("schedule");
  SCH.current = page;
  if (page) schRender(page);
  panel.classList.toggle("show", !!page);
}

function schAdvance(){
  const pages = SCH.pages;
  if (!pages.length) { schShow(null); return; }
  const i = pages.indexOf(SCH.current);
  schShow(pages[(i + 1) % pages.length]);
  // the video alone stays as long as it is set to (uninterrupted), a schedule page a shorter time
  const shown = pages[(i + 1) % pages.length];
  const seconds = shown ? SCH.data.seconds : SCH.data.video_seconds;
  SCH.timer = setTimeout(schAdvance, Math.max(5, seconds | 0) * 1000);
}

function schPages(d){
  if (!d || !d.enabled || MODE === "end") return [];
  const pages = [];
  if (d.upcoming && d.upcoming.length) pages.push("upcoming");
  if (MODE === "brb" && d.results && d.results.length) pages.push("results");
  if (pages.length) pages.unshift(null);   // the cycle starts with the video alone
  return pages;
}

document.fonts && document.fonts.ready && document.fonts.ready.then(function(){
  if (SCH.current && SCH.data) schFit(document.getElementById("schedule"), document.getElementById("schRows"));
});

function upSchedule(){
  const s = (typeof SOW.state === "function" && SOW.state()) || null;
  const d = s && s.schedule || null;
  const key = JSON.stringify(d);
  if (key === SCH.key) return;
  SCH.key = key;
  SCH.data = d;
  SCH.pages = schPages(d);

  if (!SCH.pages.length) {
    clearTimeout(SCH.timer); SCH.timer = 0;
    schShow(null);
    return;
  }
  if (SCH.timer && SCH.pages.includes(SCH.current)) {
    if (SCH.current) schRender(SCH.current);      // same page, new content: the cycle goes on
    return;
  }
  clearTimeout(SCH.timer);
  SCH.current = SCH.pages[SCH.pages.length - 1];  // so that the first advance lands on the first page
  schAdvance();
}

// The operator asked for the schedule now: leave the video at once and go on with the first page; the cycle continues from there.
function schShowNow(){
  const pages = SCH.pages;
  if (!SCH.data || pages.length < 2) return;
  clearTimeout(SCH.timer);
  SCH.current = null;                  // the video; the next page is the first one with matches
  schAdvance();
}

function startSSE(){
  try{
    const es=SOW.events();
    es.onmessage=async ev=>{
      try{
        const d=JSON.parse(ev.data||"{}"); const ch=Array.isArray(d.changed)?d.changed:[];
        if(ch.some(k=>k==="schedule")) upSchedule();
        if(ch.some(k=>k==="schedule.show")) schShowNow();
        if(ch.some(k=>k==="general.colors")) await applyColors();
		if(ch.some(k=>k==="waiting.texts")) await upText();
		if(ch.some(k=>k==="waiting.timer")) await upTimer();
		if(ch.some(k=>k==="waiting.videos")) await loadPlaylist();
		if(ch.some(k=>k==="waiting.socials")) await upSocials();
		if(ch.some(k=>k.startsWith("general."))){
		  await upOverlayLogo();
		}

        if(ch.some(k=>k==="matchtext")) await upTicker();
      }catch{}
    };
  }catch{}
}

(async ()=>{
  await applyColors();
  await Promise.all([upText(), upTimer(), loadPlaylist(), upTicker(), upOverlayLogo(), positionOverlayLogo(), upSocials()]);
  fitBigText();
  upSchedule();
  startSSE();
  setInterval(upTimer, 1000);
})();

function getStingerStartMs(){
  const qs=new URLSearchParams(location.search);
  const q=parseInt(qs.get("stinger")||qs.get("delay")||"",10);
  if(!isNaN(q)&&q>=0) return q;
  return 1800;
}
function setOverlayVisible(v){
  document.body.classList.toggle("visible",!!v);
  document.body.classList.toggle("leaving",!v);
}
document.addEventListener("DOMContentLoaded",()=>{
  setTimeout(()=>setOverlayVisible(true),getStingerStartMs());
});
document.addEventListener("visibilitychange",()=>{
  setOverlayVisible(!document.hidden);
});
