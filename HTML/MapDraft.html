<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Map Draft</title>

<style>
  @font-face{font-family:'Rajdhani';src:url("fonts/Rajdhani/Rajdhani-Bold.ttf") format('TrueType');font-weight:bold}
  @font-face{font-family:'Rajdhani';src:url("fonts/Rajdhani/Rajdhani-Regular.ttf") format('TrueType');font-weight:normal}

  html,body{
    margin:0; padding:0; width:1920px; height:1080px; overflow:hidden;
    font-family:'Rajdhani',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    font-weight:800; text-transform:uppercase;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    background:#000;
  }
  :root{
    --primary:#0f1114; --secondary:#ffffff; --tertiary:#3a3a90; --quaternary:#006ea1;
    --t1:#27AAE1; --t2:#C80013;
    --radius:12px; --radius-sm:8px; --gap:16px;
    --shadow:0 8px 22px rgba(0,0,0,.25);
    --sb-h:130px;
  }

  /* ==== SCOREBOARD ==== */
  .scoreboardwrapper{
    position:absolute; left:0; top:0; width:1920px; height:var(--sb-h);
    pointer-events:none; z-index:10;
  }
  .scorebar{
    width:1920px; height:var(--sb-h);
    background:var(--primary);
    position:relative;
    display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    align-items:stretch; padding:0 16px; box-sizing:border-box;
  }
  .scorebar::before,.scorebar::after{
    content:""; position:absolute; top:0; bottom:0; width:8px;
  }
  .scorebar::before{ left:0; background:var(--t1); }
  .scorebar::after { right:0; background:var(--t2); }

  .team{
    height:100%; display:flex; align-items:center; gap:16px;
    overflow:hidden;
  }
  .team2{ flex-direction:row-reverse; }

  .teamlogo{
    flex-shrink:0; width:80px; height:88%;
    background-size:contain; background-position:center; background-repeat:no-repeat;
  }
  .teamname{
    flex:1 1 auto; font-weight:900; font-size:64px; letter-spacing:.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--secondary); text-align:center;
  }
  /* Same reasoning as .mappick-wrap: stay in the flex flow, hidden via
     visibility, so the team name doesn't jump when scores first appear. */
  .scorebox{
    flex:0 0 105px; height:100%; display:flex; align-items:center; justify-content:center;
    background:var(--quaternary);
    visibility:hidden;
  }
  .scorebox.shown{ visibility:visible; }
  .teamscore{ font-size:68px; font-weight:900; line-height:1; color:#fff; }

  /* MAP PICK badge — kept in the flex flow at all times (hidden via
     visibility, not display) so it always reserves its width; toggling
     display:none instead would resize the flex:1 team name next to it and
     make it visibly jump sideways whenever a pick badge appears/disappears. */
  .mappick-wrap{
    flex-shrink:0; height:100%; display:flex; align-items:center;
    visibility:hidden;
  }
  .mappick-wrap.shown{ visibility:visible; }
  .mappick-badge{
    display:flex; align-items:center; gap:8px;
    padding:0 16px; height:56%;
    font-size:22px; font-weight:900; letter-spacing:1.5px;
    white-space:nowrap; border-radius:4px;
  }
  .mappick-badge.t1{ color:var(--t1); background:rgba(var(--t1-rgb),.12); }
  .mappick-badge.t2{ color:var(--t2); background:rgba(var(--t2-rgb),.12); }
  .mappick-badge .arrows{ letter-spacing:-3px; opacity:.8; font-size:20px; }

  /* center block */
  .center-info{
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
    padding:0 28px; background:var(--tertiary);
    color:var(--primary); min-width:180px;
  }
  .center-round { font-size:64px; font-weight:900; letter-spacing:.8px; line-height:1; }
  .center-format{ font-size:32px; font-weight:700; letter-spacing:.4px; opacity:.8; line-height:1.15; }

  /* ==== MAIN SCENE ==== */
  .draft-scene{
    position:absolute; left:0; top:var(--sb-h);
    width:1920px; height:calc(1080px - var(--sb-h));
    overflow:hidden;
  }

  /* Map background */
  .map-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    filter:brightness(.65) saturate(.85);
  }

  /* Gradient overlays */
  .map-overlay{
    position:absolute; inset:0;
    background:
      linear-gradient(to right,  rgba(0,0,0,.55) 0%, transparent 30%, transparent 70%, rgba(0,0,0,.55) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.2)  0%, transparent 30%, rgba(0,0,0,.65) 75%, rgba(0,0,0,.85) 100%);
  }

  /* Hero body images */
  .hero-body{
    position:absolute; top:0; bottom:0;
    width:62%;
    background-size:auto 118%;
    background-repeat:no-repeat; background-position:top center;
    z-index:2;
  }
  .hero-left{ left:0;  width:50%; }
  .hero-right{ right:0; width:50%; }

  /* Bottom bar — mirrors scorebar style */
  .bottom-bar{
    position:absolute; bottom:0; left:0; right:0; height:110px;
    background:var(--primary);
    display:grid; grid-template-columns:1fr auto 1fr;
    align-items:stretch;
    z-index:5;
  }
  .bottom-team{
    display:flex; align-items:center; justify-content:center; padding:0 24px;
    overflow:hidden;
  }
  .bottom-team.right{ justify-content:center; }

  .hero-name{
    font-size:44px; font-weight:900; letter-spacing:.8px; line-height:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--secondary);
  }

  .bottom-center{
    background:var(--tertiary); color:var(--primary);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 28px; gap:2px; min-width:200px;
  }
  .map-name-label{
    font-size:32px; font-weight:900; letter-spacing:.8px; line-height:1;
  }
  .map-mode-label{
    font-size:18px; font-weight:700; letter-spacing:.5px; opacity:.8; line-height:1.2;
  }

  /* Center divider */
  .center-divider{
    position:absolute; left:50%; top:0; bottom:110px;
    width:2px; transform:translateX(-50%);
    background:linear-gradient(to bottom, transparent 0%, rgba(255,255,255,.35) 15%, rgba(255,255,255,.35) 85%, transparent 100%);
    z-index:3; pointer-events:none;
  }

</style>
</head>
<body>

<!-- SCOREBOARD -->
<div class="scoreboardwrapper">
  <div class="scorebar">

    <!-- Team 1 (left) — score then map-pick badge, so the badge (which
         appears/disappears per map) ends up right next to the VS box
         instead of leaving a gap between it and center-info. -->
    <div class="team team1">
      <div class="teamlogo" id="t1logo"></div>
      <div class="teamname" id="t1name">TEAM 1</div>
      <div class="scorebox" id="t1scorebox">
        <span class="teamscore" id="t1score">0</span>
      </div>
      <div id="mappick-t1-wrap" class="mappick-wrap">
        <div class="mappick-badge t1"><span class="arrows">◀◀</span> MAP PICK</div>
      </div>
    </div>

    <!-- Center info -->
    <div class="center-info">
      <div class="center-round"  id="centerRound"></div>
      <div class="center-format" id="centerFormat"></div>
    </div>

    <!-- Team 2 (right, row-reverse) — DOM order: logo, name, score, mappick → displays as: mappick, score, name, logo -->
    <div class="team team2">
      <div class="teamlogo" id="t2logo"></div>
      <div class="teamname" id="t2name">TEAM 2</div>
      <div class="scorebox" id="t2scorebox">
        <span class="teamscore" id="t2score">0</span>
      </div>
      <div id="mappick-t2-wrap" class="mappick-wrap">
        <div class="mappick-badge t2">MAP PICK <span class="arrows">▶▶</span></div>
      </div>
    </div>

  </div>
</div>

<!-- MAIN SCENE -->
<div class="draft-scene">
  <div class="map-bg"      id="mapBg"></div>
  <div class="map-overlay"></div>
  <div class="hero-body hero-left"  id="heroLeft"></div>
  <div class="hero-body hero-right" id="heroRight"></div>
  <div class="center-divider"></div>
  <div class="bottom-bar">
    <div class="bottom-team">
      <div class="hero-name hero-name-left" id="heroNameLeft"></div>
    </div>
    <div class="bottom-center">
      <div class="map-name-label" id="mapNameLabel"></div>
      <div class="map-mode-label" id="mapModeLabel"></div>
    </div>
    <div class="bottom-team right">
      <div class="hero-name hero-name-right" id="heroNameRight"></div>
    </div>
  </div>
</div>

<script>
const ROOT="..", SB=ROOT+"/Scoreboard", MATCH=SB+"/Match", GENERAL=SB+"/General";
async function read(p){ try{ const r=await fetch(p+"?_="+Date.now()); return r.ok?await r.text():""; }catch{ return ""; } }
async function readJSON(p){ try{ const r=await fetch(p+"?_="+Date.now()); return r.ok?await r.json():{}; }catch{ return {}; } }
async function ok(p){ try{ const r=await fetch(p+"?_="+Date.now(),{method:"HEAD"}); return r.ok; }catch{ return false; } }
const hex=s=>/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test((s||"").trim())?(s||"").trim():null;
const setBg=(el,url)=>el&&(el.style.backgroundImage=`url('${url}?_=${Date.now()}')`);
const bySlug=list=>{ const m={}; (list||[]).forEach(x=>x?.slug&&(m[x.slug]=x)); return m; };
const nameToSlug=n=>(n||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
  .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
function hexToRgb(h){
  const s=((h||"").trim().replace(/^#/,"").toLowerCase());
  const x=s.length===3?s.split("").map(c=>c+c).join(""):s;
  const n=parseInt(x,16); if(isNaN(n)||x.length!==6) return null;
  return [(n>>16)&255,(n>>8)&255,n&255];
}

// Map hero name → HeroesBody filename (without extension)
const heroBodyOverrides={
  "d.va":"Dva","dva":"Dva",
  "lúcio":"Lucio","lucio":"Lucio",
  "soldier: 76":"Soldier_76","soldier 76":"Soldier_76","soldier:76":"Soldier_76",
  "wrecking ball":"Wrecking_Ball",
  "junker queen":"Junker_Queen",
  "jetpack cat":"Jetpack_Cat",
  "torbjörn":"Torbjörn","torbjorn":"Torbjörn",
};
function heroBodyFile(name){
  if(!name) return null;
  const lo=(name||"").toLowerCase().trim();
  if(heroBodyOverrides[lo]) return heroBodyOverrides[lo];
  return name.trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join("_");
}

/* Colors */
async function applyColors(){
  const kv={};
  (await read(GENERAL+"/colors.txt")).split(/\r?\n/).forEach(l=>{
    const m=l.match(/^\s*([^=#]+)\s*=\s*(.+?)\s*$/); if(m) kv[m[1].trim()]=m[2].trim();
  });
  const p=hex(kv.primary)||"#0f1114", s=hex(kv.secondary)||"#ffffff",
        t=hex(kv.tertiary)||"#3a3a90",  q=hex(kv.quaternary)||"#006ea1";
  document.documentElement.style.setProperty("--primary",p);
  document.documentElement.style.setProperty("--secondary",s);
  document.documentElement.style.setProperty("--tertiary",t);
  document.documentElement.style.setProperty("--quaternary",q);
}

/* Teams */
async function upT1(){
  document.getElementById("t1name").textContent=((await read(MATCH+"/T1Name.txt")).trim()||"TEAM 1").toUpperCase();
  document.getElementById("t1score").textContent=(await read(MATCH+"/T1Score.txt")).trim()||"0";
  const c=hex((await read(MATCH+"/T1Color.txt")).trim())||"#27AAE1";
  document.documentElement.style.setProperty("--t1",c);
  const rgb=hexToRgb(c)||[39,170,225];
  document.documentElement.style.setProperty("--t1-rgb",rgb.join(","));
  if(await ok(MATCH+"/T1Logo.png")) setBg(document.getElementById("t1logo"),MATCH+"/T1Logo.png");
  else document.getElementById("t1logo").style.backgroundImage="none";
}
async function upT2(){
  document.getElementById("t2name").textContent=((await read(MATCH+"/T2Name.txt")).trim()||"TEAM 2").toUpperCase();
  document.getElementById("t2score").textContent=(await read(MATCH+"/T2Score.txt")).trim()||"0";
  const c=hex((await read(MATCH+"/T2Color.txt")).trim())||"#C80013";
  document.documentElement.style.setProperty("--t2",c);
  const rgb=hexToRgb(c)||[200,0,19];
  document.documentElement.style.setProperty("--t2-rgb",rgb.join(","));
  if(await ok(MATCH+"/T2Logo.png")) setBg(document.getElementById("t2logo"),MATCH+"/T2Logo.png");
  else document.getElementById("t2logo").style.backgroundImage="none";
}
function toggleScoreBoxes(){
  const a=parseInt(document.getElementById("t1score").textContent,10)||0;
  const b=parseInt(document.getElementById("t2score").textContent,10)||0;
  const show=a!==0||b!==0;
  document.getElementById("t1scorebox").classList.toggle("shown",show);
  document.getElementById("t2scorebox").classList.toggle("shown",show);
}

/* Main scene */
async function renderScene(state){
  const mapsManifest=await readJSON(SB+"/Maps/index.json");
  const mapsBySlug=bySlug(mapsManifest.maps||[]);

  const ci=Number(state.current_map||0);
  const cur=(ci>0&&(state.maps||[])[ci-1])?state.maps[ci-1]:null;

  // Map background
  const mapBg=document.getElementById("mapBg");
  if(cur?.map){
    const slug=nameToSlug(cur.map);
    mapBg.style.backgroundImage=`url('${SB}/Maps/${slug}.png?_=${Date.now()}')`;
    const meta=mapsBySlug[slug];
    document.getElementById("mapNameLabel").textContent=(meta?.name||cur.map).toUpperCase();
    const mode=(meta?.mode||cur.mode||"").toUpperCase();
    document.getElementById("mapModeLabel").textContent=mode;
  } else {
    mapBg.style.backgroundImage="none";
    document.getElementById("mapNameLabel").textContent="";
    document.getElementById("mapModeLabel").textContent="";
  }

  // Hero bans
  const t1ban=(cur?.t1_ban||"").trim();
  const t2ban=(cur?.t2_ban||"").trim();

  const heroLeft=document.getElementById("heroLeft");
  if(t1ban){
    heroLeft.style.backgroundImage=`url('${SB}/HeroesBody/${heroBodyFile(t1ban)}.png?_=${Date.now()}')`;
    heroLeft.style.display="block";
    document.getElementById("heroNameLeft").textContent=t1ban.toUpperCase();
  } else {
    heroLeft.style.display="none";
    document.getElementById("heroNameLeft").textContent="";
  }

  const heroRight=document.getElementById("heroRight");
  if(t2ban){
    heroRight.style.backgroundImage=`url('${SB}/HeroesBody/${heroBodyFile(t2ban)}.png?_=${Date.now()}')`;
    heroRight.style.display="block";
    document.getElementById("heroNameRight").textContent=t2ban.toUpperCase();
  } else {
    heroRight.style.display="none";
    document.getElementById("heroNameRight").textContent="";
  }

  // MAP PICK indicator
  const pick=(cur?.pick||"").trim().toUpperCase();
  const w1=document.getElementById("mappick-t1-wrap");
  const w2=document.getElementById("mappick-t2-wrap");
  if(pick==="T1"||pick==="TEAM 1"||pick==="1"){
    w1.classList.add("shown"); w2.classList.remove("shown");
  } else if(pick==="T2"||pick==="TEAM 2"||pick==="2"){
    w1.classList.remove("shown"); w2.classList.add("shown");
  } else {
    w1.classList.remove("shown"); w2.classList.remove("shown");
  }

  // Center info
  const division=(state.general?.division||"").trim();
  const mapsCount=state.general?.maps_count||"";
  const mapLine=ci&&mapsCount ? `MAP ${ci}/${mapsCount}` : ci ? `MAP ${ci}` : "";
  document.getElementById("centerRound").textContent=division ? division.toUpperCase() : "VS";
  document.getElementById("centerFormat").textContent=mapLine;
}

let _prevSig=null;
async function tick(){
  try{
    const [t1n,t2n,t1s,t2s,t1c,t2c,state]=await Promise.all([
      read(MATCH+"/T1Name.txt"),read(MATCH+"/T2Name.txt"),
      read(MATCH+"/T1Score.txt"),read(MATCH+"/T2Score.txt"),
      read(MATCH+"/T1Color.txt"),read(MATCH+"/T2Color.txt"),
      readJSON(MATCH+"/match.json"),
    ]);
    const ci=Number(state.current_map||0);
    const cur=(ci>0&&(state.maps||[])[ci-1])?state.maps[ci-1]:null;
    const sig=[t1n,t2n,t1s,t2s,t1c,t2c,
      cur?.map||"",cur?.t1_ban||"",cur?.t2_ban||"",cur?.pick||"",
      state.general?.division||"",state.general?.format_type||"",state.general?.first_to||""
    ].join("|");
    if(sig!==_prevSig){
      _prevSig=sig;
      await applyColors();
      await Promise.all([upT1(),upT2()]);
      toggleScoreBoxes();
      await renderScene(state);
    }
  }finally{
    setTimeout(tick,1000);
  }
}

tick();
</script>
</body>
</html>
