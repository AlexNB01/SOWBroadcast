<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOW Broadcast - overlay preview</title>
<!--
  Every overlay at once, live, on a checkerboard so transparent parts show. Open it from the program (Preview > All overlays).
  Click a tile to see that overlay on its own, scaled to the window (the page's ?preview mode).
  The list below has to match OverlayCatalog in the program (a test checks that).
-->
<style>
  :root{ --bg:#0b1020; --text:#e8edf7; --muted:#9aa7bd; --tile:420px; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  header{ padding:14px 20px; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1{ font-size:18px; margin:0; letter-spacing:.04em; text-transform:uppercase; }
  header span{ color:var(--muted); }
  header label{ margin-left:auto; color:var(--muted); display:flex; align-items:center; gap:8px; }
  main{ display:grid; grid-template-columns:repeat(auto-fill, minmax(var(--tile), 1fr)); gap:16px; padding:0 20px 24px; }
  a.tile{ display:block; color:inherit; text-decoration:none; }
  .frame{
    position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:6px; outline:1px solid #2a3552;
    background:
      conic-gradient(#3a3f4d 25%, #2b2f3b 0 50%, #3a3f4d 0 75%, #2b2f3b 0) 0 0 / 24px 24px;
  }
  .frame iframe{ position:absolute; left:0; top:0; width:1920px; height:1080px; border:0; transform-origin:0 0; pointer-events:none; background:transparent; }
  .name{ padding:6px 2px 0; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Overlay preview</h1>
  <span>Live from the program. Click an overlay to see it large.</span>
  <label>Tile size <input id="size" type="range" min="240" max="900" value="420"></label>
</header>
<main id="grid"></main>
<script>
(function(){
  "use strict";
  // Same list as OverlayCatalog.All in the program.
  var PAGES = [
    ["In-game scoreboard", "scoreboard.html"],
    ["Map draft", "MapDraft.html"],
    ["Maps", "maps.html"],
    ["Team 1 roster", "team.html?side=1"],
    ["Team 2 roster", "team.html?side=2"],
    ["Starting soon", "waiting.html?mode=start"],
    ["Be right back", "waiting.html?mode=brb"],
    ["Thank you for watching", "waiting.html?mode=end"],
    ["Standings", "standings.html"],
    ["Bracket", "bracket.html"],
    ["Duo camera row", "duorow.html"],
    ["Trio camera row", "triorow.html"],
    ["Single camera", "singlecam.html"],
    ["Instant replay", "replay.html"],
    ["Transition", "transition.html"]
  ];

  var grid = document.getElementById("grid");
  var frames = [];

  function join(path, extra){ return path + (path.indexOf("?") < 0 ? "?" : "&") + extra; }

  PAGES.forEach(function(p){
    var a = document.createElement("a");
    a.className = "tile";
    a.href = join(p[1], "preview");
    a.target = "_blank";
    a.rel = "noopener";

    var frame = document.createElement("div");
    frame.className = "frame";
    var iframe = document.createElement("iframe");
    iframe.src = p[1];
    iframe.setAttribute("scrolling", "no");
    iframe.setAttribute("title", p[0]);
    frame.appendChild(iframe);

    var name = document.createElement("div");
    name.className = "name";
    name.textContent = p[0];

    a.appendChild(frame);
    a.appendChild(name);
    grid.appendChild(a);
    frames.push({ frame: frame, iframe: iframe });
  });

  // Each iframe is a real 1920x1080 page, shrunk to its tile.
  function fit(){
    frames.forEach(function(f){
      var scale = f.frame.clientWidth / 1920;
      f.iframe.style.transform = "scale(" + scale + ")";
    });
  }

  var size = document.getElementById("size");
  size.addEventListener("input", function(){
    document.documentElement.style.setProperty("--tile", size.value + "px");
    fit();
  });
  window.addEventListener("resize", fit);
  fit();
})();
</script>
</body>
</html>
