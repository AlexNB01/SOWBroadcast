<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Instant Replay</title>
<style>
  @font-face{font-family:'Rajdhani';src:url("fonts/Rajdhani/Rajdhani-Bold.ttf") format('TrueType');font-weight:bold}
  @font-face{font-family:'Rajdhani';src:url("fonts/Rajdhani/Rajdhani-Regular.ttf") format('TrueType');font-weight:normal}

  html,body{margin:0;padding:0;width:1920px;height:1080px;background:rgba(0,0,0,0);overflow:hidden}
  :root{
    --primary:#0f1114;
    --secondary:#ffffff;
    --tertiary:#3a3a90;
    --quaternary:#2f3a43;
  }

  video{position:absolute; inset:0; width:1920px; height:1080px; object-fit:cover; background:#000}
  .hidden{display:none}

  .replaytext{
    position:absolute; top:210px; left:30px; display:flex; flex-direction:column; align-items:flex-start;
    font-family:'Rajdhani',sans-serif; text-transform:uppercase; pointer-events:none;
  }
  .logo{
    width:150px; height:150px; object-fit:contain; filter:drop-shadow(0 8px 20px rgba(0,0,0,.35)); margin:0 0 16px 10px;
  }
  .badge{
    background:var(--primary);
    color:var(--secondary);
    border-left:7px solid var(--tertiary);
    padding:6px 12px;
    font-weight:900; font-size:48px; letter-spacing:.5px;
    box-shadow:0 8px 22px rgba(0,0,0,.25);
    animation: slidein 900ms cubic-bezier(0,0,0,1) 1200ms both;
  }

  @keyframes slidein{
    from{ transform:translateX(60px); clip-path:polygon(0 0,0 0,0 100%,0 100%); opacity:0; }
    to  { transform:none;             clip-path:polygon(0 0,100% 0,100% 100%,0 100%); opacity:1; }
  }

/* === Scene transition animations === */
video, .replaytext {
  will-change: opacity;
  transition: opacity 700ms ease;
}
body:not(.visible) video,
body.leaving       video       { opacity: 0; }
body:not(.visible) .replaytext,
body.leaving       .replaytext { opacity: 0; }
/* ?mode=clips with nothing to show: the page is empty (the scene shows what is behind it) */
body.idle video,
body.idle .replaytext { opacity: 0; }
</style>
</head>
<body>

  <video id="v1" class=""  autoplay playsinline></video>
  <video id="v2" class="hidden" autoplay playsinline></video>

  <div class="replaytext">
    <img id="brand" class="logo" alt="logo"/>
    <div class="badge"><span>REPLAY</span></div>
  </div>

<script src="sow-data.js"></script>
<script>
  const ROOT="..", SB=ROOT+"/Scoreboard", GENERAL=SB+"/General", REPLAY=SB+"/Replay", PLAYLIST=REPLAY+"/Playlist";

  const read = p => SOW.read(p);
  const ok = p => SOW.ok(p);
  const hex=s=>/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test((s||"").trim())?(s||"").trim():null;

  async function applyColors(){
    const kv={};
    (await read(GENERAL+"/colors.txt")).split(/\r?\n/).forEach(l=>{ const m=l.match(/^\s*([^=#]+)\s*=\s*(.+?)\s*$/); if(m) kv[m[1].trim().toLowerCase()]=m[2].trim(); });
    const p=hex(kv.primary)||"#0f1114", s=hex(kv.secondary)||"#fff", t=hex(kv.tertiary)||"#3a3a90", q=hex(kv.quaternary)||"#2f3a43";
    document.documentElement.style.setProperty("--primary",p);
    document.documentElement.style.setProperty("--secondary",s);
    document.documentElement.style.setProperty("--tertiary",t);
    document.documentElement.style.setProperty("--quaternary",q);
  }

  async function setLogo(){
    const cands=[GENERAL+"/OverlayLogo.png", GENERAL+"/ChannelLogo.png", GENERAL+"/image2.png", GENERAL+"/image1.png"];
    const img=document.getElementById("brand");
    for(const p of cands){ if(await ok(p)){ img.src=p+"?_="+Date.now(); return; } }
    img.classList.add("hidden");
  }

  // What the stream shows depends on ?mode=
  //   instant : the newest clip, looped (its trim and speed applied by this page - the file is never cut). Asks of the operator are ignored.
  //   clips   : what the operator asks for (one clip, a category, ...): played once through, in order. Then the page is empty again.
  //   (none)  : both, as this page always did: a request plays once through and the page goes back to the newest clip.
  // The program puts the newest clip and the request in /api/state under "replay".
  const MODE = (new URLSearchParams(location.search).get("mode") || "").toLowerCase();
  const INSTANT = MODE === "instant", CLIPS = MODE === "clips";
  if (CLIPS) document.body.classList.add("idle");

  const vids = { 1: document.getElementById("v1"), 2: document.getElementById("v2") };
  let active = 1;           // the video that is visible
  let token = 0;            // every change of what is shown makes the older one's events void
  let latestKey = "";       // what the loop is showing now
  let seenNonce = null;     // the newest play request this page has handled
  let sequenceRunning = false;

  const clipUrl = c => `${PLAYLIST}/${encodeURIComponent(c.file)}`;
  const clipKey = c => [c.file, c.start_ms || 0, c.end_ms || 0, c.speed || 1].join("|");

  // Shows a clip on the hidden video and fades it in once it is moving. onDone: what to do at the end of the shown part (default: loop it).
  function show(clip, onDone){
    const my = ++token;
    const nextId = active === 1 ? 2 : 1;
    const nv = vids[nextId], ov = vids[active];
    const start = (clip.start_ms || 0) / 1000, end = (clip.end_ms || 0) / 1000;
    const speed = clip.speed > 0 ? clip.speed : 1;
    let revealed = false;
    const reveal = () => {
      if (revealed || my !== token) return;
      revealed = true;
      nv.classList.remove("hidden");
      ov.classList.add("hidden");
      active = nextId;
      setTimeout(() => { if (my === token) ov.pause(); }, 800);
    };
    const finish = () => {
      if (my !== token) return;
      if (onDone) onDone();
      else { nv.currentTime = start; nv.play().catch(() => {}); }
    };
    nv.pause();
    nv.onloadedmetadata = () => { nv.currentTime = start; nv.playbackRate = speed; };
    nv.onplaying = reveal;
    nv.ontimeupdate = () => { if (my === token && end > 0 && nv.currentTime >= end) finish(); };
    nv.onended = finish;
    nv.defaultPlaybackRate = speed;
    nv.src = clipUrl(clip);
    nv.playbackRate = speed;
    nv.play().catch(() => {});
    setTimeout(reveal, 2500);   // never stay on the old picture because a clip is slow to start
  }

  function showLatest(){
    const r = (SOW.state() || {}).replay || {};
    if (!r.latest) return false;
    const key = clipKey(r.latest);
    if (key !== latestKey) { latestKey = key; show(r.latest, null); }
    return true;
  }

  // ?mode=clips: nothing to show. The picture fades out, then the video stops.
  function goIdle(){
    token++;
    sequenceRunning = false;
    latestKey = "";
    if (document.body.classList.contains("idle")) return;
    document.body.classList.add("idle");
    setTimeout(() => { if (document.body.classList.contains("idle")) { vids[1].pause(); vids[2].pause(); } }, 800);
  }

  function leaveIdle(){
    if (!document.body.classList.contains("idle")) return;
    document.body.classList.remove("idle");
    const badge = document.querySelector(".badge");
    if (badge) { badge.style.animation = "none"; void badge.offsetWidth; badge.style.animation = ""; }
  }

  function playSequence(clips){
    const next = i => {
      if (i >= clips.length) {
        if (CLIPS) { goIdle(); return; }
        sequenceRunning = false; latestKey = ""; showLatest(); return;
      }
      show(clips[i], () => next(i + 1));
    };
    sequenceRunning = true;
    leaveIdle();
    next(0);
  }

  function sync(){
    if (INSTANT) { showLatest(); return; }
    const st = SOW.state() || {};
    const r = st.replay || {};
    const play = r.play;
    if (seenNonce === null) {
      seenNonce = play ? play.nonce : 0;
      // OBS loads this page when the scene comes up: a request made just before is still shown
      if (play && play.clips && play.clips.length && (st.server_time || 0) - play.at < 15000) { playSequence(play.clips); return; }
    } else if (play && play.nonce !== seenNonce) {
      seenNonce = play.nonce;
      if (play.clips && play.clips.length) { playSequence(play.clips); return; }
      sequenceRunning = false;   // "stop": back to the newest clip (or, with ?mode=clips, to an empty page)
      latestKey = "";
      if (CLIPS) { goIdle(); return; }
    }
    if (CLIPS) return;
    if (!sequenceRunning) showLatest();
  }

  // Without the clip list (an older program, or clips copied in by hand) the file replaypath.txt names the clip to loop.
  let lastName = "";
  async function tick(){
    if (CLIPS || sequenceRunning || ((SOW.state() || {}).replay || {}).latest) return;
    const name = (await read(REPLAY+"/replaypath.txt")).trim();
    if (!name || name === lastName) return;
    lastName = name;
    show({ file: name, start_ms: 0, end_ms: 0, speed: 1 }, null);
  }

  async function init(){
    await applyColors();
    await setLogo();
    await ok(SB + "/Match/T1Name.txt");   // loads the state
    sync();
    SOW.events().onmessage = () => sync();
    await tick();
    setInterval(tick, 1000);
  }

  document.addEventListener("DOMContentLoaded", init);

function getStingerStartMs(){
  const qs=new URLSearchParams(location.search);
  const q=parseInt(qs.get("stinger")||qs.get("delay")||"",10);
  if(!isNaN(q)&&q>=0) return q;
  return 1800;
}
function setOverlayVisible(v){
  document.body.classList.toggle("visible",!!v);
  document.body.classList.toggle("leaving",!v);
  if(v){
    // re-trigger badge slide animation
    const badge=document.querySelector(".badge");
    if(badge){ badge.style.animation="none"; void badge.offsetWidth; badge.style.animation=""; }
  }
}
document.addEventListener("DOMContentLoaded",()=>{
  setTimeout(()=>setOverlayVisible(true),getStingerStartMs());
});
document.addEventListener("visibilitychange",()=>{
  setOverlayVisible(!document.hidden);
});
</script>
</body>
</html>
