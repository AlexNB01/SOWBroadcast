name: CI

# Builds the program (Debug for the tests, Release as the installer will) and runs every test on each push and pull request.
# Node.js is installed because some tests run the overlay data layer (HTML/sow-data.js) the way a browser does.

on:
  push:
    branches: [main, v3]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (Debug)
        run: dotnet build src/SowBroadcast.sln -c Debug --nologo

      - name: Build the program as released (Release)
        run: dotnet build src/SowBroadcast.App/SowBroadcast.App.csproj -c Release --nologo

      - name: Test
        run: dotnet test src/SowBroadcast.sln -c Debug --no-build --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
