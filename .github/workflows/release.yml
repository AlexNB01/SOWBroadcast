name: Release

# Publishing a version: push a tag like v3.1.0 (the version in src/SowBroadcast.App/SowBroadcast.App.csproj must be 3.1.0).
# The installer with its checksum (what "Check for updates" in the program downloads and runs) and the hero and map list
# (Scoreboard/manifest.json, what "Update hero and map list" reads) are attached to the GitHub release.
#
# Code signing (SignPath Foundation, free for open-source projects; setup in tools/signpath/README.md): add the secret SIGNPATH_API_TOKEN
# and the repository variable SIGNPATH_ORGANIZATION_ID and the installer is signed by SignPath before it is attached to the release;
# without the secret the release is unsigned (Windows SmartScreen will warn when it is installed).

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Image tools
        run: python -m pip install pillow

      - name: The tag matches the version of the program
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/SowBroadcast.App/SowBroadcast.App.csproj -getProperty:Version -nologo).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match the program version $version." }

      - name: Test
        run: dotnet test src/SowBroadcast.sln -c Debug --nologo

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Installer
        shell: pwsh
        run: ./tools/build-installer.ps1

      # SignPath signs the finished installer (the setup program, which is what SmartScreen looks at). It is handed over as a GitHub artifact
      # and the signed copy comes back; the checksum the program verifies after downloading is then made again from the signed file.
      - name: Hand the installer to SignPath
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: artifacts/installer/SOWBroadcast-Setup-*.exe

      - name: Sign the installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sowbroadcast
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Use the signed installer
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-installer -Recurse -Filter 'SOWBroadcast-Setup-*.exe' | Select-Object -First 1
          if (-not $signed) { throw 'SignPath returned no installer.' }
          $setup = Get-ChildItem artifacts/installer -Filter 'SOWBroadcast-Setup-*.exe' | Select-Object -First 1
          Copy-Item $signed.FullName $setup.FullName -Force
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne 'Valid') { throw "The installer is not validly signed: $($signature.Status)" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($setup.FullName).sha256", "$hash  $($setup.Name)`n")
          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/*
            Scoreboard/manifest.json
