name: Release

# Publishing a version: push a tag like v3.1.0 (the version in src/SowBroadcast.App/SowBroadcast.App.csproj must be 3.1.0).
# The installer with its checksum (what "Check for updates" in the program downloads and runs) and the hero and map list
# (Scoreboard/manifest.json, what "Update hero and map list" reads) are attached to the GitHub release.
#
# Code signing: add the secrets SIGN_PFX_BASE64 (the certificate as base64) and SIGN_PFX_PASSWORD and the installer and the program
# is signed; without them the release is unsigned (Windows SmartScreen will warn when it is installed).

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Image tools
        run: python -m pip install pillow

      - name: The tag matches the version of the program
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/SowBroadcast.App/SowBroadcast.App.csproj -getProperty:Version -nologo).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match the program version $version." }

      - name: Test
        run: dotnet test src/SowBroadcast.sln -c Debug --nologo

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Certificate (when the secrets exist)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
            "SIGN_PFX=$env:RUNNER_TEMP\sign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Installer
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if ($env:SIGN_PFX) {
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
            ./tools/build-installer.ps1 -SignTool "`"$signtool`" sign /f `"$env:SIGN_PFX`" /p `"$env:SIGN_PFX_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f"
          }
          else { ./tools/build-installer.ps1 }

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/*
            Scoreboard/manifest.json
