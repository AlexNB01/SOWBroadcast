<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Standings</title>
<style>
  @font-face{font-family:'Rajdhani';src:url("../../HTML/fonts/Rajdhani/Rajdhani-Bold.ttf") format('TrueType');font-weight:bold}
  @font-face{font-family:'Rajdhani';src:url("../../HTML/fonts/Rajdhani/Rajdhani-Regular.ttf") format('TrueType');font-weight:normal}
  html,body{margin:0;padding:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:'Rajdhani',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#fff}
  :root{
    --bg:#0f1114;
    --panel:#16191f;
    --line:rgba(255,255,255,0.08);
    --accent:#55aaff;
    --qualified:#33d17a;
    --eliminated:#ff5c5c;
    --flash:rgba(255,255,255,0.3);
  }
  .frame{box-sizing:border-box;padding:80px 90px;display:flex;flex-direction:column;gap:18px;height:100%;}
  .title{font-size:58px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
  .subtitle{font-size:28px;font-weight:500;opacity:0.7;letter-spacing:0.5px;margin-top:-8px;}
  .table{background:var(--panel);border-radius:18px;padding:22px 26px;box-shadow:0 18px 40px rgba(0,0,0,0.45);display:flex;flex-direction:column;gap:12px;}
  .row{display:grid;align-items:center;gap:16px;padding:10px 12px;border-radius:12px;transition:background 0.6s ease;}
  .row.header{font-size:20px;text-transform:uppercase;letter-spacing:1px;opacity:0.75;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .row.body{font-size:28px;font-weight:700;background:rgba(0,0,0,0.15);}
  .row.body:not(:last-child){margin-bottom:6px;}
  .cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank{width:70px;text-align:center;}
  .team{display:flex;align-items:center;gap:16px;min-width:0;}
  .logo{width:48px;height:48px;background-size:contain;background-position:center;background-repeat:no-repeat;border-radius:10px;background-color:#0b0d10;}
  .status{padding:6px 12px;border-radius:999px;font-size:18px;text-transform:uppercase;letter-spacing:1px;justify-self:end;}
  .status.qualified{background:rgba(51,209,122,0.2);color:var(--qualified);}
  .status.eliminated{background:rgba(255,92,92,0.2);color:var(--eliminated);}
  .flash{animation:flash 1.2s ease;}
  .flash-cell{animation:flashCell 1.2s ease;}
  @keyframes flash{
    0%{background:var(--flash);}100%{background:rgba(0,0,0,0.15);}
  }
  @keyframes flashCell{
    0%{color:#fff;}50%{color:var(--accent);}100%{color:#fff;}
  }
</style>
</head>
<body>
  <div class="frame">
    <div>
      <div class="title" id="title">Standings</div>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="table">
      <div class="row header" id="header"></div>
      <div id="rows"></div>
    </div>
  </div>
<script>
  const SB = "..";
  let previous = null;

  function isAbsolute(path){
    return /^(https?:|file:|data:)/i.test(path) || /^[a-zA-Z]:[\\/]/.test(path) || path.startsWith("/") || path.startsWith("\\\\");
  }
  function logoUrl(path){
    if(!path) return "";
    if(isAbsolute(path)){
      if(path.startsWith("file:") || path.startsWith("http")) return path;
      return `file:///${path.replace(/\\/g,"/")}`;
    }
    return `${SB}/${path.replace(/\\/g,"/")}`;
  }

  function buildHeader(mode){
    const header = document.getElementById("header");
    header.innerHTML = "";
    const labels = mode === "maps_for_against"
      ? ["Rank","Team","W","L","MF","MA","Status"]
      : ["Rank","Team","W","L","MD","Status"];
    labels.forEach(label=>{
      const div = document.createElement("div");
      div.className = "cell";
      div.textContent = label;
      header.appendChild(div);
    });
    header.style.gridTemplateColumns = mode === "maps_for_against"
      ? "80px 1fr 80px 80px 90px 90px 160px"
      : "80px 1fr 80px 80px 90px 160px";
  }

  function rowKey(row, index){
    return row.team || row.abbr || row.logo || String(index);
  }

  function render(data){
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    title.textContent = data.title || "Standings";
    subtitle.textContent = data.subtitle || "";

    const mode = (data.columns || {}).mode || "map_diff";
    buildHeader(mode);

    const rowsWrap = document.getElementById("rows");
    rowsWrap.innerHTML = "";

    const prevRows = new Map();
    const prevOrder = new Map();
    if(previous && previous.rows){
      previous.rows.forEach((row, idx)=>{
        prevRows.set(rowKey(row, idx), row);
        prevOrder.set(rowKey(row, idx), idx);
      });
    }

    (data.rows || []).forEach((row, idx)=>{
      const key = rowKey(row, idx);
      const prev = prevRows.get(key);
      const changed = prev && JSON.stringify(prev) !== JSON.stringify(row);
      const moved = prevOrder.has(key) && prevOrder.get(key) !== idx;

      const rowEl = document.createElement("div");
      rowEl.className = "row body" + ((changed || moved) ? " flash" : "");
      rowEl.style.gridTemplateColumns = mode === "maps_for_against"
        ? "80px 1fr 80px 80px 90px 90px 160px"
        : "80px 1fr 80px 80px 90px 160px";

      const rank = document.createElement("div");
      rank.className = "cell rank";
      rank.textContent = row.rank || idx + 1;
      rowEl.appendChild(rank);

      const team = document.createElement("div");
      team.className = "cell team";
      const logo = document.createElement("div");
      logo.className = "logo";
      const logoPath = logoUrl(row.logo || "");
      if(logoPath){
        logo.style.backgroundImage = `url('${logoPath}?_=${Date.now()}')`;
      }
      const name = document.createElement("div");
      name.textContent = row.team || "";
      name.className = changed ? "flash-cell" : "";
      team.appendChild(logo);
      team.appendChild(name);
      rowEl.appendChild(team);

      const w = document.createElement("div");
      w.className = "cell";
      w.textContent = row.wins ?? 0;
      if(prev && prev.wins !== row.wins) w.classList.add("flash-cell");
      rowEl.appendChild(w);

      const l = document.createElement("div");
      l.className = "cell";
      l.textContent = row.losses ?? 0;
      if(prev && prev.losses !== row.losses) l.classList.add("flash-cell");
      rowEl.appendChild(l);

      if(mode === "maps_for_against"){
        const mf = document.createElement("div");
        mf.className = "cell";
        mf.textContent = row.maps_for ?? 0;
        if(prev && prev.maps_for !== row.maps_for) mf.classList.add("flash-cell");
        rowEl.appendChild(mf);

        const ma = document.createElement("div");
        ma.className = "cell";
        ma.textContent = row.maps_against ?? 0;
        if(prev && prev.maps_against !== row.maps_against) ma.classList.add("flash-cell");
        rowEl.appendChild(ma);
      } else {
        const md = document.createElement("div");
        md.className = "cell";
        md.textContent = row.map_diff ?? 0;
        if(prev && prev.map_diff !== row.map_diff) md.classList.add("flash-cell");
        rowEl.appendChild(md);
      }

      const status = document.createElement("div");
      status.className = "cell status";
      if(row.status){
        status.textContent = row.status;
        status.classList.add(row.status);
      }
      rowEl.appendChild(status);

      rowsWrap.appendChild(rowEl);
    });
    previous = data;
  }

  async function load(){
    try{
      const res = await fetch(`standings.json?_=${Date.now()}`);
      if(!res.ok) return;
      const data = await res.json();
      render(data);
    }catch(e){
      // ignore
    }
  }

  load();
  setInterval(load, 1000);
</script>
</body>
</html>
